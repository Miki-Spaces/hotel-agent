services:
  - type: web
    name: hotel-ai-voice-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.11
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: VOICE_BOT_API_KEY
        sync: false
      - key: BOTNOI_ACCESS_TOKEN
        sync: false
      - key: BOTNOI_AGENT_ID
        sync: false
      - key: FRONTEND_ALLOWED_ORIGINS
        sync: false
